<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beaver Apps</title>
  <meta name="description" content="Little pixel apps with a beaver in them.">
  <link rel="icon" href="reader/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
  <style>
    :root { --bg:#dbc9b4; --surface:#fcecd1; --ink:#2d1e2f; --accent:#7a3b4f; --shadow:#a94b54; }
    @media (prefers-color-scheme: dark) { :root { --bg:#2d1e2f; --surface:#392945; --ink:#fcecd1; --accent:#f09f71; --shadow:#7a3b4f; } }   /* accents that keep 4.5:1 in both */
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink);
      font-family:Silkscreen, monospace; text-transform:uppercase; letter-spacing:.04em; }
    main { width:min(560px, 100%); display:flex; flex-direction:column; gap:20px; }
    h1 { margin:0; font-weight:400; font-size:24px; text-shadow:3px 3px 0 var(--shadow); }
    p { margin:0; font-size:11px; line-height:1.8; }
    .app { display:flex; gap:16px; align-items:center; padding:16px; background:var(--surface); color:var(--ink); text-decoration:none;
      box-shadow:0 0 0 4px #2d1e2f, 6px 6px 0 4px rgba(45,30,47,.3); }
    .app:hover, .app:focus-visible { outline:4px solid var(--accent); outline-offset:6px; }
    .app b { display:block; font-weight:400; font-size:15px; color:var(--accent); margin-bottom:6px; }
    .app img { width:56px; height:56px; image-rendering:pixelated; flex:none; }
    footer { font-size:11px; }
    footer a { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Beaver Apps</h1>
    <p>Little pixel apps with a beaver in them :)</p>
    <a class="app" href="reader/"><img src="reader/icons/favicon.svg" alt=""><span><b>Beaver Reader</b><p>An EPUB and PDF reader and library. The beaver climbs the bookcase and reads along.</p></span></a>
    <footer>Made with acorns by <a href="https://github.com/BwunLevain">BwunLevain</a> · part of <a href="https://github.com/beaver-apps">Beaver Apps</a> on GitHub</footer>
  </main>
</body>
</html>
